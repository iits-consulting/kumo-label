[project]
name = "kumo-label"
version = "0.1.0"
description = "Labeling and Active Learning Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "uvicorn>=0.42.0",
    "torch",
    "torchvision",
    "transformers",
    "Pillow",
    "umap-learn",
    "scikit-learn",
    "numpy",
    "lightning",
    "hydra-core",
    "omegaconf",
    "torchmetrics",
    "pycocotools",
    "timm>=1.0.26",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
gpu = [
    "cuml-cu13>=26.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kumo_label"]

[tool.pytest.ini_options]
testpaths = ["tests"]
